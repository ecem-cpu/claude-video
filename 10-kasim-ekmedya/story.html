    --ink:#1E1B19;
    --muted:#7d746c;

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;background:var(--paper);overflow:hidden}

  #title span{display:inline-block}
  #sub{top:345px;font-size:30px;font-weight:500;letter-spacing:.42em;color:var(--coral);padding-left:.42em}

  #photo{position:absolute;left:0;top:395px;width:1080px;height:800px;

    filter:brightness(1.1) contrast(1.15);

            mask-image:linear-gradient(to bottom,transparent 0,#000 10%,#000 80%,transparent 100%),linear-gradient(to right,transparent 0,#000 7%,#000 93%,transparent 100%);
            mask-composite:intersect}

  #quote{top:1192px;padding:0 120px;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:42px;line-height:1.32}
  #quote .l{display:block}
  #attrib{top:1450px;font-size:21px;letter-spacing:.34em;color:var(--muted);font-weight:500}

const lines = [...document.querySelectorAll('#quote .l')];

function render(t) {
  $('stage').style.opacity = easeOut(prog(t, 0, 0.6));
  letters.forEach((s, i) => {
    const p = easeOut(prog(t, 0.3 + i * 0.09, 0.8));
    s.style.opacity = p; s.style.transform = `translateY(${(1 - p) * 40}px)`; s.style.filter = `blur(${(1 - p) * 8}px)`;
  });
  const ps = easeOut(prog(t, 1.4, 1.0));
  $('sub').style.opacity = ps; $('sub').style.letterSpacing = `${0.7 - 0.28 * ps}em`;

  const pp = easeOut(prog(t, 1.0, 2.2));
  $('photo').style.opacity = pp;
  $('photo').style.transform = `translateY(${(1 - pp) * 50}px) scale(${1.06 - 0.06 * easeOut(prog(t, 0, DURATION))})`;

  lines.forEach((l, i) => fadeUp(l, prog(t, 3.4 + i * 0.6, 1.0), 18));
  fadeUp($('attrib'), prog(t, 6.0, 0.9), 14);

  $('rule').style.width = `${easeInOut(prog(t, 6.8, 1.0)) * 120}px`;
  fadeUp($('msg'), prog(t, 7.3, 1.0), 20);
  const pl = easeOut(prog(t, 8.2, 1.0));
  $('logo').style.opacity = pl; $('logo').style.transform = `scale(${0.9 + 0.1 * pl})`;
}
window.DURATION = DURATION; window.render = render;
if (!new URLSearchParams(location.search).has('capture')) {
  const t0 = performance.now();
  (function loop(now) { render(((now - t0) / 1000) % DURATION); requestAnimationFrame(loop); })(t0);
} else render(0);
</script>
</body>
